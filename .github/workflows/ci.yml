name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify committed parcel kernel
        shell: bash
        run: |
          rebuilt_kernel="$(mktemp)"
          trap 'rm -f "$rebuilt_kernel"' EXIT
          npx asc tools/parcel-kernel/assembly/index.ts \
            --outFile "$rebuilt_kernel" \
            -O3 \
            --runtime stub \
            --noAssert \
            --enable simd
          if ! cmp --silent "$rebuilt_kernel" tools/parcel-kernel/build/parcel-kernel.wasm; then
            echo "The committed parcel-kernel.wasm does not match its AssemblyScript source."
            echo "Run 'npm run parcel-kernel:build' and commit the rebuilt binary."
            exit 1
          fi
      - name: Vite build
        run: npm run build

  quality:
    name: Quality (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: npx eslint . --quiet
          - name: Typecheck
            command: npm run typecheck
          - name: Format
            command: npm run format:check
          - name: Node tests
            command: node --test tests-node/*.test.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  browser:
    name: Browser tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: React browser tests
        timeout-minutes: 20
        run: npm run smoke:react -- --shard=${{ matrix.shard }}/6
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-shard-${{ matrix.shard }}
          path: test-results/react
          if-no-files-found: ignore
          retention-days: 7
